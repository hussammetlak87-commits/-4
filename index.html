    <style>
        :root {

            --text: #0f172a;

            --border: #e2e8f0;
            --success: #16a34a;
            --success-bg: #dcfce7;
            --danger: #dc2626;
            --danger-bg: #fee2e2;
            --hint-bg: #fef3c7;
            --hint-border: #f59e0b;
            --hint-text: #92400e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }

        header h1 {
            margin: 0 0 10px 0;
            font-size: 2rem;
        }

        header p {
            margin: 0;
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .question-card {
            background: var(--card);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        .question-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 18px;
            color: var(--text);
        }

        .options-list {
            list-style: none;
            padding: 0;
            margin: 0 0 16px 0;
        }

        .options-list li {
            margin-bottom: 10px;
        }

        .options-list label {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: #fff;
        }

        .options-list label:hover {
            background-color: #f1f5f9;
            border-color: var(--primary);
        }

        .options-list input[type="radio"] {
            margin-left: 12px;
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
        }

        .hint-btn {
            background-color: #f1f5f9;
            color: var(--text-light);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .hint-btn:hover {
            background-color: #e2e8f0;
            color: var(--text);
        }

        .hint-box {
            display: none;
            background-color: var(--hint-bg);
            border: 1px solid var(--hint-border);
            color: var(--hint-text);
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 12px;
            font-size: 0.95rem;
        }

        .feedback {
            margin-top: 14px;
            font-weight: 700;
            font-size: 1rem;
        }

        .wrong-option {
            background-color: var(--danger-bg) !important;
            border-color: var(--danger) !important;
            color: #991b1b !important;
            font-weight: bold;
        }

        .correct-option {
            background-color: var(--success-bg) !important;
            border-color: var(--success) !important;
            color: #166534 !important;
            font-weight: bold;
        }

        #submit-btn {
            display: block;
            width: 100%;
            padding: 16px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin: 30px 0;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        #submit-btn:hover {
            background-color: var(--primary-dark);
        }

        #score-board {
            display: none;
            background: white;
            padding: 24px;
            border-radius: 12px;
            text-align: center;
            border: 2px solid var(--primary);
            margin-bottom: 30px;
        }

        #score-board h2 {
            margin: 0 0 10px 0;
            color: var(--primary);
        }
    </style>
</head>

function shuffleOptions() {
    // إزالة الحروف الأصلية ثم خلط الخيارات مع الحفاظ على الإجابة الصحيحة.
    quizData.forEach(item => {
        const correctOption = item.options[item.correct];
        const cleanOptions = item.options.map(option =>
            option.replace(/^\s*[أبجد]\s*[\)\-ـ:.]\s*/, "")
        );
        const correctText = cleanOptions[item.correct];
        for (let i = cleanOptions.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [cleanOptions[i], cleanOptions[j]] = [cleanOptions[j], cleanOptions[i]];
        }
        item.options = cleanOptions;
        item.correct = cleanOptions.indexOf(correctText);
    });
}

function showFeedback(index, userChoice) {
    const item = quizData[index];
    const feedback = document.getElementById(`feedback-${index}`);
    item.options.forEach((_, optIdx) => {
        const label = document.getElementById(`label-${index}-${optIdx}`);
        if (label) label.classList.remove('correct-option', 'wrong-option');
    });

    if (userChoice === item.correct) {
        document.getElementById(`label-${index}-${userChoice}`).classList.add('correct-option');
        feedback.style.color = 'var(--success)';
        feedback.textContent = 'إجابة صحيحة!';
    } else {
        document.getElementById(`label-${index}-${userChoice}`).classList.add('wrong-option');
        document.getElementById(`label-${index}-${item.correct}`).classList.add('correct-option');
        feedback.style.color = 'var(--danger)';
        feedback.textContent = 'إجابة خاطئة. الإجابة الصحيحة مميزة باللون الأخضر.';
    }
}

function checkAnswer(index, userChoice) {
    showFeedback(index, userChoice);
}

function renderQuestions() {
    const container = document.getElementById('questions-container');
    let html = '';

    quizData.forEach((item, index) => {
        html += `
            <div class="question-card" id="card-${index}">
                <div class="question-title">${index + 1}. ${item.q}</div>
                <ul class="options-list">
        `;

        const optionLetters = ["أ", "ب", "ج", "د"];
        item.options.forEach((opt, optIdx) => {
            html += `
                <li>
                    <label id="label-${index}-${optIdx}">
                        <input type="radio" name="q-${index}" value="${optIdx}" onchange="checkAnswer(${index}, ${optIdx})">
                        ${optionLetters[optIdx]}) ${opt}
                    </label>
                </li>
            `;
        });

        html += `
                </ul>
                <button type="button" class="hint-btn" onclick="toggleHint(${index})">💡 تلميح للإجابة الصحيحة</button>
                <div class="hint-box" id="hint-${index}">${item.hint}</div>
                <div class="feedback" id="feedback-${index}"></div>
            </div>
        `;
    });

    container.innerHTML = html;
}

function toggleHint(index) {
    const hintBox = document.getElementById(`hint-${index}`);
    hintBox.style.display = hintBox.style.display === 'block' ? 'none' : 'block';
}

function gradeQuiz() {
    let score = 0;
    let answered = 0;
    const total = quizData.length;

    quizData.forEach((item, index) => {
        const selectedOption = document.querySelector(`input[name="q-${index}"]:checked`);
        const feedback = document.getElementById(`feedback-${index}`);

        if (selectedOption) {
            answered++;
            const userChoice = parseInt(selectedOption.value, 10);
            if (userChoice === item.correct) score++;
            showFeedback(index, userChoice);
        } else {
            item.options.forEach((_, optIdx) => {
                const label = document.getElementById(`label-${index}-${optIdx}`);
                label.classList.remove('correct-option', 'wrong-option');
            });
            document.getElementById(`label-${index}-${item.correct}`).classList.add('correct-option');
            feedback.style.color = 'var(--danger)';
            feedback.textContent = 'لم تتم الإجابة عن هذا السؤال.';
        }
    });

    const unanswered = total - answered;
    const percentage = Math.round((score / total) * 100);
    const scoreBoard = document.getElementById('score-board');
    const scoreText = document.getElementById('score-text');
    scoreText.innerHTML = `
        <div>${score} من أصل ${total} درجة</div>
        <div>${percentage}% النسبة المئوية</div>
        <div style="font-size:1rem; margin-top:8px;">الإجابات الصحيحة: ${score} | تمت الإجابة عن: ${answered} | الأسئلة المتروكة: ${unanswered}</div>
    `;
    scoreBoard.style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

window.onload = () => { shuffleOptions(); renderQuestions(); };
